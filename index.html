<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>

    <script src="libraries/p5.min.js"></script>
    <script src="libraries/p5.sound.min.js"></script>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="divCanvas">
        <!-- where canvas is added -->
    </div>

    <main>
        <nav class="karla">
            <div id="navbar">
                <p style="color: #fff;">VH</p>

                <div id="links">
                    <a href="">Projects</a>
                    <a href="">About</a>
                    <a href="">Contact</a>
                    <a href="" style="color: #ebd084;">Get CV</a>
                </div>
            </div>
        </nav>

        <!-- INTRO -->
        <section id="intro">
            <h1 class="bungee-regular">FRONTEND <br> DEVELOPER</h1>
        </section>

        <!-- PROJECTS -->
        <section class="karla" id="projects">

            <!-- PROJECT #1 -->
            <div>
                <article class="project">
                    <!-- header -->
                    <header>
                        <div>
                            <img src="images/LB_logo.png"
                                alt='logo of the project "Liberdade Cravada"'
                                width="5%">
                            <h3>Liberdade Cravada</h3>
                        </div>
                        
                        <div>
                            <span class="headerBtn minimizeBtn">&#8211;</span>
                            <span class="headerBtn fullscreenBtn">&#9723;</span>
                            <span class="closeBtn">✕</span>
                        </div>
                    </header>

                    <!-- body -->
                    <div class="body">
                        <img src="images/LB_screenshot.png"
                            alt='first section of the main page of the project "Liberdade Cravada"'
                            width="100%"
                            class="projectImg">

                        <p class="description">
                            A gamified interactive project that explores the Portuguese Revolution of April 25, 1974
                            through mini-games and alternative interaction methods.
                        </p>

                        <span class="projectTech">
                            <figure>
                                <img src="https://imgs.search.brave.com/IwWmXgdExAsOEhkFvEcM0xl3Uu5qlZpvf4C3LJB7t5E/rs:fit:860:0:0:0/g:ce/aHR0cHM6Ly9jZG4u/d29ybGR2ZWN0b3Js/b2dvLmNvbS9sb2dv/cy9kM2pzLnN2Zw"
                                    alt="logo of d3.js">
                                <figcaption>d3.js</figcaption>
                            </figure>
                        </span>
                    </div>

                    <!-- footer -->
                    <footer>
                        <a href="" class="lDemo">Live demo</a>
                        <a href="" class="cStudy">Case study</a>
                        <a href="" class="github">Github</a>
                    </footer>

            </div>


        </section>

    <script src="sketch.js"></script>
